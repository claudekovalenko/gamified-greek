name: Deploy

# Publishes the site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
#
#   - push                 any commit to the default branch
#   - workflow_run         after "Sync content" — its commits are pushed with
#                          GITHUB_TOKEN, which never fires a push event
#   - workflow_dispatch    run it by hand from the Actions tab

on:
  push:
  workflow_run:
    workflows: [Sync content]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Publish only from the repository's default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the phone-app project (app/) is built by app.yml, not served
      - run: rm -rf app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
