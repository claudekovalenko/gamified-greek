name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/gamified-greek-learning-4uz504]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is off, so a brand-new repo
          # publishes on its first run without a visit to Settings.
          enablement: true
      # Plain static files: the repository root is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
